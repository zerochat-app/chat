<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7a6d">
<meta name="description" content="ChatSpace - グループもDMも使えるリアルタイムチャット">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChatSpace">
<title>ChatSpace</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="stylesheet" href="./css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg,#eaf0ee);color:#0e7a6d;font:700 24px sans-serif;z-index:0}
#boot small{display:block;font:400 13px sans-serif;opacity:.7;text-align:center;margin-top:8px}
#app:not(:empty)~#boot{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="boot"><div>ChatSpace<small id="bootmsg">読み込み中…</small></div></div>
<noscript><p style="padding:20px">ChatSpace を使うには JavaScript を有効にしてください。</p></noscript>
<script>
window.addEventListener('error',function(e){var m=document.getElementById('bootmsg');if(m)m.textContent='読み込みに失敗しました: '+(e.message||'')+'（再読み込みしてください）'});
window.addEventListener('unhandledrejection',function(e){var m=document.getElementById('bootmsg');if(m)m.textContent='読み込みに失敗しました: '+((e.reason&&e.reason.message)||e.reason)});
</script>
<script type="module" src="./js/main.js"></script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
</script>
</body>
</html>
